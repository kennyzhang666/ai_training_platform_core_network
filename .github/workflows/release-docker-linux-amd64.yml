name: Build Linux Docker delivery

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag or full commit SHA to build
        required: true
        default: main
        type: string
      image_tag:
        description: Container tag, for example 0.9.8-docker.1
        required: true
        default: 0.9.8-docker.1
        type: string
      release_tag:
        description: GitHub Release tag for the offline Docker bundle
        required: true
        default: v0.9.8-docker.1
        type: string
      publish:
        description: Push GHCR images and publish the offline Docker bundle
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-linux-amd64-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux amd64 Docker stack
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve immutable build identity
        shell: bash
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_IMAGE_TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$ ]] || {
            printf 'Invalid container tag: %s\n' "$REQUESTED_IMAGE_TAG" >&2
            exit 1
          }
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(node -p "require('./package.json').version")
          revision=$(git rev-parse HEAD)
          printf 'IMAGE_REPOSITORY=%s\n' "$repository" >> "$GITHUB_ENV"
          printf 'IMAGE_REF=%s:%s\n' "$repository" "$REQUESTED_IMAGE_TAG" >> "$GITHUB_ENV"
          printf 'POSTGRES_IMAGE=postgres:16-bookworm\n' >> "$GITHUB_ENV"
          printf 'PLATFORM_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'VCS_REF=%s\n' "$revision" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build native Linux image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "$IMAGE_REF" \
            --build-arg "VERSION=$PLATFORM_VERSION" \
            --build-arg "VCS_REF=$VCS_REF" \
            .

      - name: Prepare smoke configuration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/docker/manage.sh
          deploy/docker/manage.sh Prepare
          sed -i \
            -e "s|^AI_TRAINING_IMAGE=.*|AI_TRAINING_IMAGE=$IMAGE_REF|" \
            -e "s|^POSTGRES_IMAGE=.*|POSTGRES_IMAGE=$POSTGRES_IMAGE|" \
            -e 's|^PLATFORM_BOOTSTRAP_GLOBAL_ADMIN_EMPLOYEE_NO=.*|PLATFORM_BOOTSTRAP_GLOBAL_ADMIN_EMPLOYEE_NO=w00123|' \
            -e 's|^LDAP_SERVER=.*|LDAP_SERVER=mock.invalid|' \
            -e 's|^LDAP_BASE_DN=.*|LDAP_BASE_DN=dc=mock,dc=invalid|' \
            -e 's|^LDAP_BIND_PREFIX=.*|LDAP_BIND_PREFIX=|' \
            -e 's|^LDAP_START_TLS=.*|LDAP_START_TLS=false|' \
            -e 's|^LDAP_MOCK=.*|LDAP_MOCK=true|' \
            -e 's|^EVALUATION_WORKER_EMPLOYEE_NO=.*|EVALUATION_WORKER_EMPLOYEE_NO=w00123|' \
            -e 's|^EVALUATION_WORKER_NAME=.*|EVALUATION_WORKER_NAME=本地开发用户|' \
            deploy/docker/.env
          cat > deploy/docker/code-agent/bin/code-agent <<'SH'
          #!/bin/sh
          exec node /opt/ai-training/scripts/code-agent-local-bridge.mjs "$@"
          SH
          chmod +x deploy/docker/code-agent/bin/code-agent

      - name: Start and smoke-test Docker stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose --project-directory deploy/docker --env-file deploy/docker/.env -f deploy/docker/compose.yaml up -d --wait --wait-timeout 240
          curl -fsS http://127.0.0.1:8080/healthz
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = '302'
          docker compose --project-directory deploy/docker --env-file deploy/docker/.env -f deploy/docker/compose.yaml \
            exec -T api node -e "fetch('http://127.0.0.1:3000/api/v1/health').then(async r=>{if(!r.ok)throw new Error(await r.text())})"
          docker compose --project-directory deploy/docker --env-file deploy/docker/.env -f deploy/docker/compose.yaml \
            exec -T gateway curl -fsS http://127.0.0.1:8081/healthz
          docker compose --project-directory deploy/docker --env-file deploy/docker/.env -f deploy/docker/compose.yaml ps

      - name: Stop smoke stack
        if: always()
        shell: bash
        run: |
          docker compose --project-directory deploy/docker --env-file deploy/docker/.env -f deploy/docker/compose.yaml down -v --remove-orphans || true

      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push application image
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"
          docker tag "$IMAGE_REF" "$IMAGE_REPOSITORY:docker-latest"
          docker push "$IMAGE_REPOSITORY:docker-latest"

      - name: Build offline Docker bundle
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$POSTGRES_IMAGE"
          bundle_root="$RUNNER_TEMP/docker-bundle"
          output_root="$GITHUB_WORKSPACE/release"
          archive="$output_root/ai-training-platform-${PLATFORM_VERSION}-docker-linux-amd64.tar.gz"
          mkdir -p "$bundle_root/code-agent/bin" "$bundle_root/certs" "$bundle_root/backups" "$bundle_root/wheelhouse" "$output_root"
          cp deploy/docker/compose.yaml "$bundle_root/compose.yaml"
          cp deploy/docker/.env.example "$bundle_root/.env.example"
          cp deploy/docker/manage.sh "$bundle_root/manage.sh"
          cp DEPLOYMENT.html "$bundle_root/DEPLOYMENT.html"
          sed -i \
            -e "s|^AI_TRAINING_IMAGE=.*|AI_TRAINING_IMAGE=$IMAGE_REF|" \
            -e "s|^POSTGRES_IMAGE=.*|POSTGRES_IMAGE=$POSTGRES_IMAGE|" \
            "$bundle_root/.env.example"
          printf '%s\n' "$PLATFORM_VERSION" > "$bundle_root/VERSION"
          chmod +x "$bundle_root/manage.sh"
          docker save "$IMAGE_REF" "$POSTGRES_IMAGE" | gzip -1 > "$bundle_root/docker-images.tar.gz"
          tar -C "$bundle_root" -czf "$archive" .
          (cd "$output_root" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

      - name: Verify offline image round-trip
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          archive="release/ai-training-platform-${PLATFORM_VERSION}-docker-linux-amd64.tar.gz"
          checksum="$archive.sha256"
          (cd release && sha256sum --check "$(basename "$checksum")")
          unpacked="$RUNNER_TEMP/docker-bundle-verify"
          mkdir "$unpacked"
          tar -xzf "$archive" -C "$unpacked"
          docker image rm "$IMAGE_REF" >/dev/null
          gzip -dc "$unpacked/docker-images.tar.gz" | docker load >/dev/null
          docker image inspect "$IMAGE_REF" >/dev/null
          docker image inspect "$POSTGRES_IMAGE" >/dev/null

      - name: Publish offline Docker bundle
        if: inputs.publish
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive="release/ai-training-platform-${PLATFORM_VERSION}-docker-linux-amd64.tar.gz"
          notes="$RUNNER_TEMP/docker-release-notes.md"
          cat > "$notes" <<EOF
          AI 能力训战平台 ${PLATFORM_VERSION} · Linux amd64 Docker 离线包。

          应用源码提交：${VCS_REF}
          应用镜像：${IMAGE_REF}
          数据库镜像：${POSTGRES_IMAGE}

          解压后执行 ./manage.sh Prepare，填写企业 LDAP、管理员与 Code Agent 配置，再执行 ./manage.sh Start。
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
              --target "$VCS_REF" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes"
          fi
