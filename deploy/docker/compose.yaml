name: ${COMPOSE_PROJECT_NAME:-ai-training-platform}

x-platform-service: &platform-service
  image: ${AI_TRAINING_IMAGE:-ghcr.io/kennyzhang666/ai_training_platform_core_network:0.9.8-docker.1}
  pull_policy: missing
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
  networks:
    - platform

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_training}
      POSTGRES_USER: ${POSTGRES_USER:-ai_training}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先执行 manage.sh Prepare 并配置 POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - platform

  init:
    <<: *platform-service
    command: ["init"]
    user: "0:0"
    restart: "no"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - platform-data:/var/lib/ai-training

  api:
    <<: *platform-service
    command: ["api"]
    user: "10001:10001"
    environment:
      NODE_ENV: production
      PLATFORM_DEPLOYMENT_PROFILE: single-node
      PLATFORM_REPOSITORY: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_training}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_training}?schema=public&connection_limit=${POSTGRES_CONNECTION_LIMIT:-20}&pool_timeout=${POSTGRES_POOL_TIMEOUT:-30}
      HOST: 0.0.0.0
      PORT: "3000"
      OBJECT_STORAGE_MODE: local
      ARTIFACT_ROOT: /var/lib/ai-training/artifacts
      ARTIFACT_UPLOAD_TMP_ROOT: /var/lib/ai-training/artifact-uploads
      ENGINE_PACKAGE_ROOT: /var/lib/ai-training/engine-packages
      PLATFORM_IDENTITY_MODE: TRUSTED_GATEWAY
      TRUSTED_GATEWAY_HMAC_SECRET: ${TRUSTED_GATEWAY_HMAC_SECRET:?请配置可信网关密钥}
      TRUSTED_GATEWAY_MAX_AGE_SECONDS: ${TRUSTED_GATEWAY_MAX_AGE_SECONDS:-90}
      PLATFORM_BOOTSTRAP_GLOBAL_ADMIN_EMPLOYEE_NO: ${PLATFORM_BOOTSTRAP_GLOBAL_ADMIN_EMPLOYEE_NO:?请配置首位全局管理员工号}
      ALLOW_ANONYMOUS_LOCAL: "false"
      INTRANET_HTTP_ONLY: "true"
      EMBEDDED_EVALUATION_WORKER: "false"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    volumes:
      - platform-data:/var/lib/ai-training
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  gateway:
    <<: *platform-service
    command: ["gateway"]
    user: "10001:10001"
    environment:
      LDAP_GATEWAY_HOST: 0.0.0.0
      LDAP_GATEWAY_PORT: "8081"
      TRUSTED_GATEWAY_HMAC_SECRET: ${TRUSTED_GATEWAY_HMAC_SECRET:?请配置可信网关密钥}
      TRUSTED_GATEWAY_MAX_AGE_SECONDS: ${TRUSTED_GATEWAY_MAX_AGE_SECONDS:-90}
      LDAP_GATEWAY_SESSION_SECRET: ${LDAP_GATEWAY_SESSION_SECRET:?请配置登录会话密钥}
      LDAP_GATEWAY_COOKIE_SECURE: ${LDAP_GATEWAY_COOKIE_SECURE:-false}
      INTRANET_HTTP_ONLY: "true"
      LDAP_SERVER: ${LDAP_SERVER:?请配置企业 LDAP 地址}
      LDAP_PORT: ${LDAP_PORT:-389}
      LDAP_USE_SSL: ${LDAP_USE_SSL:-false}
      LDAP_START_TLS: ${LDAP_START_TLS:-true}
      LDAP_BASE_DN: ${LDAP_BASE_DN:?请配置企业 LDAP 根 DN}
      LDAP_BIND_PREFIX: ${LDAP_BIND_PREFIX:-}
      LDAP_ACCOUNT_ATTRIBUTE: ${LDAP_ACCOUNT_ATTRIBUTE:-sAMAccountName}
      LDAP_TITLE_ATTRIBUTE: ${LDAP_TITLE_ATTRIBUTE:-title}
      LDAP_DEPARTMENT_ATTRIBUTE: ${LDAP_DEPARTMENT_ATTRIBUTE:-department}
      LDAP_NAME_ATTRIBUTE: ${LDAP_NAME_ATTRIBUTE:-displayName}
      LDAP_TIMEOUT_SECONDS: ${LDAP_TIMEOUT_SECONDS:-5}
      LDAP_CA_CERT_FILE: ${LDAP_CA_CERT_FILE:-}
      LDAP_MOCK: ${LDAP_MOCK:-false}
    volumes:
      - ./certs:/opt/ai-training/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    <<: *platform-service
    command: ["worker"]
    user: "10001:10001"
    environment:
      NODE_ENV: production
      PLATFORM_API: http://api:3000/api/v1
      EVALUATION_WORKER_ID: ${EVALUATION_WORKER_ID:-docker-worker-01}
      EVALUATION_WORKER_EMPLOYEE_NO: ${EVALUATION_WORKER_EMPLOYEE_NO:?请配置 Worker 管理员工号}
      EVALUATION_WORKER_NAME: ${EVALUATION_WORKER_NAME:?请配置 Worker 管理员姓名}
      EVALUATION_WORKER_DEPARTMENT: ${EVALUATION_WORKER_DEPARTMENT:-}
      EVALUATION_WORKER_TRUSTED_GATEWAY_SECRET: ${TRUSTED_GATEWAY_HMAC_SECRET:?请配置可信网关密钥}
      EVALUATION_BATCH_ROOT: /var/lib/ai-training/evaluation-batches
      EVALUATION_LOG_ROOT: /var/lib/ai-training/evaluation-logs
      EVALUATION_KEEP_BATCHES: ${EVALUATION_KEEP_BATCHES:-false}
      ENGINE_CACHE_ROOT: /var/lib/ai-training/worker-engines
      ENGINE_PIP_OFFLINE: "true"
      ENGINE_PIP_FIND_LINKS_JSON: '["/opt/ai-training/wheelhouse","/opt/ai-training/extra-wheelhouse"]'
      PIP_CACHE_DIR: /var/lib/ai-training/pip-cache
      PYTHON: /usr/bin/python3
      CODE_AGENT_COMMAND: ${CODE_AGENT_COMMAND:?请配置 Code Agent 命令}
      CODE_AGENT_ARGS_JSON: '${CODE_AGENT_ARGS_JSON:?请配置 Code Agent 参数 JSON}'
      CODE_AGENT_ALLOWED_EXECUTABLES: ${CODE_AGENT_ALLOWED_EXECUTABLES:?请配置 Code Agent 允许列表}
      CODE_AGENT_BATCH_TIMEOUT_SECONDS: ${CODE_AGENT_BATCH_TIMEOUT_SECONDS:-3600}
    volumes:
      - platform-data:/var/lib/ai-training
      - ${CODE_AGENT_BUNDLE_PATH:-./code-agent}:/opt/code-agent:ro
      - ${ENGINE_WHEELHOUSE_PATH:-./wheelhouse}:/opt/ai-training/extra-wheelhouse:ro
    depends_on:
      api:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  web:
    <<: *platform-service
    command: ["web"]
    user: "10001:10001"
    ports:
      - "${PLATFORM_BIND_ADDRESS:-0.0.0.0}:${PLATFORM_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  platform:
    driver: bridge

volumes:
  postgres-data:
  platform-data:
