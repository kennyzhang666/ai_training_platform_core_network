stages:
  - lint
  - test
  - build
  - contract
  - grader

default:
  image: node:20-bookworm
  cache:
    key: pnpm-lock
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.8.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    # `postinstall` only runs when the install actually does work. A warm
    # node_modules would otherwise leave the Prisma client ungenerated and
    # every job that imports it would fail at runtime.
    - pnpm --filter @ai-training/platform-api prisma:generate

lint:
  stage: lint
  script:
    - pnpm lint

node-test:
  stage: test
  script:
    - pnpm test

ldap3-gateway-test:
  stage: test
  image: python:3.11-slim
  script:
    - python services/ldap3-gateway/test_ldap3_gateway.py

postgres-integration:
  stage: test
  image: node:20-bookworm
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: ai_training
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_training
    POSTGRES_INTEGRATION: "true"
  script:
    - >-
      node -e "const net=require('net'); const deadline=Date.now()+60000; (async()=>{for(;;){try{await new Promise((resolve,reject)=>{const s=net.createConnection({host:'postgres',port:5432}); s.once('connect',()=>{s.destroy();resolve();}); s.once('error',reject);}); break;}catch(error){if(Date.now()>=deadline) throw error; await new Promise(resolve=>setTimeout(resolve,1000));}}})().catch(error=>{console.error(error);process.exit(1);});"
    - pnpm --filter @ai-training/platform-api test:integration:postgres

build:
  stage: build
  script:
    - pnpm kit:test
    - pnpm build

contract-test:
  stage: contract
  script:
    - pnpm contract:test

grader-test:
  stage: grader
  image: python:3.11-slim
  before_script:
    - python -m pip install --disable-pip-version-check -r grader/requirements.txt
  script:
    - python -m unittest discover -s grader/tests -v
